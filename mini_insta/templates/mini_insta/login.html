{% extends "mini_insta/base.html" %} {% block content %}
<div>
  <h2>Login</h2>
  <form method="post" action="{% url 'login' %}" style="margin: 0 auto;"> 
    {% csrf_token %}
    {{ form.as_table }}
    <button type="submit">Log In</button>
    <input type="hidden" name="next" value="{% url 'show_all_profiles' %}">
  </form>
  Don't have an account? <a href="{% url 'register' %}">Register now.</a>.
</div>
{% endblock content %}
