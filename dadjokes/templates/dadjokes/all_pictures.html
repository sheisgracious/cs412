{% extends "dadjokes/base.html" %} {% block content %}
<h2>All Dad Jokes Pictures</h2>
<ul>
  {% for picture in pictures %}
  <li>
    <a href="{% url 'show_picture' picture.pk %}">
      <img
        src="{{ picture.image_url }}"
        alt="Dad Joke Picture"
        height="auto"
        width="200"
    /></a>
  </li>
  {% empty %}
  <li>No pictures available.</li>
</ul>
{% endfor %} {% endblock content %}
