{% extends "dadjokes/base.html" %} {% block content %}
<h2>All Dad Jokes</h2>
<ul>
  {% for joke in jokes %}
  <li>
    <a href="{% url 'show_joke' joke.pk %}">{{ joke.joke_text }}</a>
    <ul>
      <li>By: {{ joke.contributor }}</li>
    </ul>
  </li>
  {% empty %}
  <p>No jokes available.</p>
</ul>
{% endfor %} {% endblock content %}
